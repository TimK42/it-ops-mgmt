name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format

      - name: Lint check
        run: npm run lint

  test:
    runs-on: ubuntu-24.04
    needs: lint
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Bash test suite (unit + integration)
        run: npm test

      - name: Node.js test suite (integration)
        run: npm run test:js

      - name: Node test runner (regression tests)
        run: node --test tests/test-issue119-layout.js tests/test-issue151-caching.js

      - name: Mocha test suite (DOM/unit)
        run: npm run test:mocha
