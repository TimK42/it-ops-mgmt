<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IT Operations Knowledge Base - QA Library" />
    <title>IT Operations - Knowledge Base</title>

    <!-- Open Graph (static generic values) -->
    <meta property="og:title" content="IT Operations - Knowledge Base" />
    <meta property="og:description" content="IT Operations Knowledge Base - QA Library" />
    <meta property="og:url" content="https://it-ops-kb.local" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (function () {
        var theme = null;
        try {
          var s = localStorage.getItem('theme');
          if (s === 'dark' || s === 'light') theme = s;
        } catch (e) {
          /* ignore */
        }
        if (!theme && typeof window.matchMedia === 'function') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (!theme) theme = 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <!-- favicon.ico replaced inline SVG data-URI (#256) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4f46e5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IT Ops KB" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="app">
      <a href="#main-content" class="skip-link">Skip to content</a>
      <main id="main-content" class="main" tabindex="-1">
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <div class="loading-text">Loading...</div>
        </div>
      </main>
    </div>

    <div class="modal-overlay" id="detail-modal"></div>
    <div class="modal-overlay" id="form-modal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">New Entry</div>
          <button
            class="modal-close"
            data-action="close-modal"
            data-modal="form-modal"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button class="btn btn-ghost btn-sm" data-action="close-modal" data-modal="form-modal">
            Cancel
          </button>
          <button class="btn btn-primary btn-sm">Save</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="confirm-modal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div class="modal-title" id="confirm-title">Confirm</div>
          <button class="modal-close" data-action="close-confirm" aria-label="Close">✕</button>
        </div>
        <div class="modal-body" id="confirm-message"></div>
        <div class="modal-footer custom-modal-footer" id="confirm-actions">
          <button class="btn btn-ghost btn-sm" data-action="close-confirm">Cancel</button>
          <button class="btn btn-sm btn-danger" id="confirm-ok">Confirm</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="session-warning-modal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div class="modal-title">Session Expiring</div>
        </div>
        <div class="modal-body">
          <p style="margin-bottom: 12px">Your session will expire soon due to inactivity.</p>
          <p style="font-size: 13px; color: #888">
            Click "Stay Logged In" to keep your session active.
          </p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost btn-sm" data-action="logout">Sign Out</button>
          <button class="btn btn-primary btn-sm" data-action="stay-logged-in">
            Stay Logged In
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <div id="pwa-install-banner"></div>
    <script src="/js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker
          .register('/sw.js')
          .catch((err) => console.warn('SW registration failed:', err));
      }
    </script>
  </body>
</html>
