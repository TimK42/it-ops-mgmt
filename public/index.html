<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IT Operations Knowledge Base - QA Library" />
    <title>IT Operations - Knowledge Base</title>
    <link rel="stylesheet" href="/fonts/inter.css" />
    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔧%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <main id="main-content" class="main" tabindex="-1">
    <div id="app">
      <div class="login-page" id="login-fallback">
        <div class="login-card">
          <h1>IT Operations</h1>
          <div class="login-sub">Knowledge Base</div>
          <div class="login-error" id="login-error"></div>
          <form method="POST" action="/api/auth/login" id="login-form">
            <div class="form-group">
              <label for="login-user" class="sr-only">Username</label>
              <input
                id="login-user"
                class="form-input"
                name="username"
                placeholder="Username"
                autocomplete="username"
                autofocus
              />
            </div>
            <div class="form-group">
              <label for="login-pass" class="sr-only">Password</label>
              <input
                id="login-pass"
                class="form-input"
                type="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
              />
            </div>
            <button class="btn btn-primary" type="submit">Sign In</button>
          </form>
          <div class="login-link"><a href="/register">Create account</a></div>
        </div>
      </div>
    </div>
    </main>

    <div class="modal-overlay" id="detail-modal"></div>
    <div class="modal-overlay" id="form-modal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">New Entry</div>
          <button class="modal-close" onclick="closeModal('form-modal')" aria-label="Close">
            ✕
          </button>
        </div>
        <div class="modal-body"></div>
        <div class="modal-footer">
          <button class="btn btn-ghost btn-sm" onclick="closeModal('form-modal')">Cancel</button>
          <button class="btn btn-primary btn-sm">Save</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="confirm-modal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div class="modal-title" id="confirm-title">Confirm</div>
          <button class="modal-close" onclick="closeConfirm()" aria-label="Close">✕</button>
        </div>
        <div class="modal-body" id="confirm-message"></div>
        <div class="modal-footer custom-modal-footer" id="confirm-actions">
          <button class="btn btn-ghost btn-sm" onclick="closeConfirm()">Cancel</button>
          <button class="btn btn-sm btn-danger" id="confirm-ok">Confirm</button>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="session-warning-modal">
      <div class="modal modal-sm">
        <div class="modal-header">
          <div class="modal-title">Session Expiring</div>
        </div>
        <div class="modal-body">
          <p style="margin-bottom: 12px">Your session will expire soon due to inactivity.</p>
          <p style="font-size: 13px; color: #888">
            Click "Stay Logged In" to keep your session active.
          </p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
          <button class="btn btn-primary btn-sm" onclick="stayLoggedIn()">Stay Logged In</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/app.js"></script>
  </body>
</html>
